[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=../node_modules/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
local = "http://127.0.0.1:8545"

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "mixed-case-function"]
